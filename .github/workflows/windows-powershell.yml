name: Windows PowerShell

on:
  push:
    paths:
      - "windows/**"
      - ".github/workflows/windows-powershell.yml"
  pull_request:
    paths:
      - "windows/**"
      - ".github/workflows/windows-powershell.yml"

permissions:
  contents: read

jobs:
  powershell-51:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Parse, install, and test with Windows PowerShell 5.1
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $scripts = @(
              "windows\install-windows.ps1",
              "windows\po0fw.ps1"
          )

          foreach ($script in $scripts) {
              $bytes = [IO.File]::ReadAllBytes((Resolve-Path $script))
              if ($bytes.Length -lt 3 -or $bytes[0] -ne 0xEF -or $bytes[1] -ne 0xBB -or $bytes[2] -ne 0xBF) {
                  throw "$script must be UTF-8 with BOM for Windows PowerShell 5.1"
              }

              $tokens = $null
              $errors = $null
              [Management.Automation.Language.Parser]::ParseFile(
                  (Resolve-Path $script),
                  [ref]$tokens,
                  [ref]$errors
              ) | Out-Null
              if ($errors.Count -gt 0) {
                  throw "$script has parser errors: $($errors.Message -join '; ')"
              }

              $fragileContinuations = Get-Content -LiteralPath $script | Where-Object { $_ -match '`[ \t]*$' }
              if ($fragileContinuations) {
                  throw "$script contains fragile backtick line continuations"
              }
          }

          try {
              & .\windows\install-windows.ps1 -Tokens "pgnfw_ci_dummy@0" -SkipInitialRun

              $task = Get-ScheduledTask -TaskName "po0fw" -ErrorAction Stop
              if (-not $task.Actions -or $task.Actions[0].Execute -ne "wscript.exe") {
                  throw "Scheduled task action was not registered with wscript.exe"
              }
              if ($task.Actions[0].Arguments -notmatch 'po0fw-hidden\.vbs') {
                  throw "Scheduled task action is missing po0fw-hidden.vbs"
              }
              if ($task.Triggers.Count -ne 2) {
                  throw "Expected timer and network triggers, got $($task.Triggers.Count)"
              }

              $installed = Join-Path $env:ProgramData "po0fw\po0fw.ps1"
              $tokens = $null
              $errors = $null
              [Management.Automation.Language.Parser]::ParseFile(
                  $installed,
                  [ref]$tokens,
                  [ref]$errors
              ) | Out-Null
              if ($errors.Count -gt 0) {
                  throw "Installed worker has parser errors: $($errors.Message -join '; ')"
              }

              # End-to-end test installed worker against a local loopback mock HTTP server
              $tcpProbe = New-Object System.Net.Sockets.TcpListener([System.Net.IPAddress]::Loopback, 0)
              $tcpProbe.Start()
              $port = ([System.Net.IPEndPoint]$tcpProbe.LocalEndpoint).Port
              $tcpProbe.Stop()

              $listener = New-Object System.Net.HttpListener
              $listener.Prefixes.Add("http://127.0.0.1:$port/")
              $listener.Start()
              $serverJob = $null
              try {
                  $serverJob = [PowerShell]::Create().AddScript({
                      param($l)
                      try {
                          while ($l.IsListening) {
                              $ctx = $l.GetContext()
                              $body = '{"enabled":true,"currentIp":"203.0.113.0/24","limit":5,"whitelist":[{"ip":"203.0.113.0/24","slot":0}]}'
                              $buf = [System.Text.Encoding]::UTF8.GetBytes($body)
                              $ctx.Response.StatusCode = 200
                              $ctx.Response.ContentType = "application/json"
                              $ctx.Response.OutputStream.Write($buf, 0, $buf.Length)
                              $ctx.Response.Close()
                          }
                      } catch {}
                  }).AddArgument($listener)
                  $null = $serverJob.BeginInvoke()

                  $addOut = & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $installed -ApiBase "http://127.0.0.1:$port/api/firewall" | Out-String
                  if ($LASTEXITCODE -ne 0 -or $addOut -notmatch '203\.0\.113\.0/24') {
                      throw "Worker add test failed: $addOut"
                  }

                  $stOut = & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $installed -Status -ApiBase "http://127.0.0.1:$port/api/firewall" | Out-String
                  if ($LASTEXITCODE -ne 0 -or $stOut -notmatch '1/5') {
                      throw "Worker status test failed: $stOut"
                  }
              } finally {
                  $listener.Stop()
                  $listener.Close()
                  if ($serverJob) { $serverJob.Dispose() }
              }
          } finally {
              Unregister-ScheduledTask -TaskName "po0fw" -Confirm:$false -ErrorAction SilentlyContinue
              Remove-Item -LiteralPath (Join-Path $env:ProgramData "po0fw") -Recurse -Force -ErrorAction SilentlyContinue
          }
